server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/my-web/html;
    index index.html index.htm;

    location / {
        try_files $uri $uri/ =404;
    }

    # Khu vực quản trị: yêu cầu HTTP Basic Authentication
    location /admin {
        auth_basic "Restricted Admin Area";
        auth_basic_user_file /etc/nginx/.htpasswd;
        try_files $uri $uri/ =404;
    }

    # Trang lỗi 404 tùy chỉnh (từ bài 2)
    error_page 404 /404.html;

    location = /404.html {
        root /var/www/my-web/html;
        internal;
    }
}
